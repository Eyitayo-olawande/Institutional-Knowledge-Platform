# Checks for every work package (Development Roadmap v1, build loop step 4).
# Nothing merges with failing checks.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real PostgreSQL for integration tests (Development Roadmap v1, section 9).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MANTLE_PG_SERVER_URL: postgres://postgres:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high
